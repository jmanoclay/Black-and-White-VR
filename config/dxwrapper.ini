; dxwrapper's settings for the mod (bwvr\dxwrapper\dxwrapper.ini). The game's Direct3D 7 runs on
; Direct3D 9Ex, so the eye pictures go to SteamVR on the GPU instead of through the CPU.
; Used when bwvr.ini's [proxy] chain names bwvr\dxwrapper\dxwrapper.dll.

[General]
RealDllPath                = AUTO
WrapperMode                = ddraw

[Compatibility]
; Direct3D 7 on Direct3D 9, and 9Ex (needed to share the eye textures with Direct3D 11).
Dd7to9                     = 1
D3d9to9Ex                  = 1

[Dd7to9]
; No D3DCREATE_MULTITHREADED: every Direct3D 9 call took a lock (about 0.3 ms an eye).
DdrawNoMultiThreaded       = 1

[d3d9]
; No emulated wait for the monitor's vertical blank when the game flips its window.
EnableVSync                = 0
ForceVsyncMode             = 1
