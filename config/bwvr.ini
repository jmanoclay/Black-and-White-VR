; Black & White VR mod settings. Lives in <game>\bwvr\bwvr.ini.

[mod]
; 0 = the proxy only forwards to the real ddraw.dll (no hooks at all)
enabled=1

[proxy]
; Another ddraw.dll to load instead of the system one (relative to the game folder, or a full path).
; dxwrapper runs the game's Direct3D 7 on Direct3D 9, and the eye pictures go to SteamVR on the GPU
; instead of through the CPU (about 2 ms a frame less; see documentation/performance.md). Empty: the
; system's. If it can't be loaded, the system's is used.
chain=bwvr\dxwrapper\dxwrapper.dll

[stereo]
; Texture filtering in the eye passes (the game sets none): 0 the game's, 1 linear with mipmaps,
; 2 also anisotropic. The mipmap levels themselves are made by [textures].
texture_filter=1
; How far away objects (villagers, trees, houses) are still drawn, in percent of the game's own
; distance (700 units: 70 m at world_scale 10). Beyond it they vanish. Runtime: stereo.req object_distance
object_distance_percent=250
; How far objects keep their full detail before going to plainer meshes and, far off, fading out,
; in percent of the game's (most things: full detail to 11.7 m, faded out by 87 m; animated things
; such as a gate's post fade from about 27 m). Runtime: stereo.req detail_distance
detail_distance_percent=300
; The engine draws the world once, from between the eyes, and its drawing is replayed into each
; eye with every point moved to that eye (1). About a third less time over busy views; 0 draws
; each eye with its own engine pass, as before. Runtime: stereo.req one_pass
one_pass=1
; The helper spirits (the advisers) hover round the edge of the game's screen. In VR they are
; placed in the same directions from the head as in the flat game's view (100), or this much
; nearer the middle (percent; 0: where the game's own sums put them, out of sight).
; Runtime: stereo.req helper_spread
helper_spread_percent=70
; 3D sound heard from the head: sounds move as the player looks round (0: from the game's camera).
head_audio=1
; The game squashes its hand for a moment as it picks up or lets go; in the headset that looked like
; a distortion. 1: drawn without it.
unsquash_hand=1
; Render the 3D world once per eye (engine-level stereo), from the game's launch. Runtime control:
; control\stereo.req. (The test harness starts the game flat: BWVR_START=mono in its environment.)
enabled=1
; Engine units per real-world meter (the god's size). Tuned in Phase 2 with the headset.
world_scale=10
; Rows of each final eye image. The Index panel has 1600; the D3D7 path caps render targets at
; 2048 px, which allows 1865 rows with the Index's field of view (the render target is then
; 2044x1876). Higher is clamped to that.
eye_height=1865
; 1 = keep the horizon level (yaw-only tracking origin); 0 = follow the game camera's pitch.
level_base=0
; Render the second eye with zero time increments, so both eyes show the same instant.
zero_time=1
; What the game window shows in VR: 1 = one eye filling the window (good for recording),
; 2 = both eyes side by side, 0 = nothing.
mirror=1
; Draw the other controller's hand too (a mirrored copy of the god hand; it can't grab).
second_hand=1
; Cutscenes (scenes that take the camera) play on a cinema screen in front of you; point at it
; and the laser is the mouse (trigger = left button, grip = right). With cutscene_screen=0 the
; game's camera carries you along instead.
cutscene_carry=1
cutscene_screen=1

[audio]
; Windows remembers each program's volume per output device, left and right separately; for the
; game on the Index it had saved the right side at 0 (the sound mostly in the left ear). 1: the
; mod keeps the game's sound even between the channels.
even_balance=1
; The game's audio library waits 20 ms on the game's thread each time it stops a sound (to fade
; it out), which froze the game for 40-170 ms at times. 1: the fade goes on without the wait.
async_stop=1

[textures]
; The game makes every texture a single level, so far textures shimmer. 1: the game's textures get
; a mip chain, made again (a box filter) after each time the game writes into a texture.
mipmaps=1
; Levels, the full size included (4: 256 down to 32). Many textures are pages of several images:
; more levels let neighbours bleed into each other in the distance.
mip_levels=4
; Textures smaller than this stay single-level.
min_size=16
; Mip level offset in the eye passes (negative: sharper but more shimmer). Runtime: stereo.req lod_bias
lod_bias=0

[vr]
; openvr = SteamVR head tracking + output to the headset; mock = scripted head pose (tests).
; Ctrl+F12 recentres the view while in VR.
backend=openvr

[fix]
; Clip pre-transformed triangles that reach behind the eye (otherwise garbage or holes at VR FOV).
near_clip=1
; Draw the sea as world geometry during VR eye passes (the engine's screen-space sea swims with head roll/turns)
sea_world=1

[trace]
; Return addresses recorded per traced call.
stack_depth=6
; Trace this many frames as soon as the D3D device exists (0 = only on request).
capture_frames_at_device=0

[debug]
; Save bwvr\captures\live.bmp every N ms (0 = off).
live_screenshot_ms=0

[hands]
; The god hand is always at your controller. Grip: pick up what is directly under it (see the
; marker on the ground), let go to drop or throw. A toggles the laser, also while carrying (it
; recalls the hand with what it holds, or sends it back out). With the laser on: grip picks up at
; a distance, holding the trigger drags the land, a double trigger pull travels to the spot.
; The other hand's stick moves you.
near_hand=1
always_hand=1
; The hand at your controller grabs the object it is touching (inside its bounding sphere),
; wherever that is. Failing that, it grabs what is just below it within reach_cm of the ground.
touch_grab=1
reach_cm=25
; Mark the ground point below the hand with a line and a diamond (0 = off).
ground_marker=0
; A hand on a creature strokes or slaps it without any button: rub slowly to stroke, swipe fast to slap.
pet=1
; Hold something you are carrying up to a creature for a moment and it is handed over (no need to let go).
give=1
; How much of your hand's motion over the creature counts (percent). Lower = harder to slap by accident.
pet_gain_percent=75
; Gestures: hold B and draw with the fingertip (or the laser's point); a pink trail follows it,
; and only what is drawn with B held counts. 0: B gives the laser while held, and every motion of
; the empty hand is drawing (as the flat game's mouse).
gesture_button_b=1
; A scaffold carried in the hand: its blueprint holds still and turns with the wrist, this many
; tenths of the twist (20: twice as far; 0: it turns by itself, as in the flat game). Let go gently,
; it is built where the blueprint shows; let go touching another scaffold, the two join.
blueprint_twist_x10=20
build_at_blueprint=1
; The shield goes up as its circle closes, the trigger still held (0: when the trigger is let go of).
shield_autocast=1
combine_by_touch=1
; The trigger taps things that can be tapped (a story scroll, a door): with your hand on it, or with the laser on it.
tap=1
; With the creature on the leash, the trigger on a thing (hand on it, or laser on it) sends the
; creature to it; the grip still picks things up. The leash starts at your VR hand (0 = at the
; game's own hand, as in the flat game).
leash_to_hand=1
; The trigger on your own creature (hand on it, or laser) puts the leash on or takes it off; two
; quick pulls on a thing tie the leash to it (the flat game's double click).
; Shaking the hand left and right quickly drops the leash (or, later, a miracle in the hand):
; this many reversals, each faster than this (cm/s).
shake_speed_cm_s=100
shake_reversals=4
; Both triggers (hand at the controller) grab the world with two hands: move, turn (and scale, below).
; Off: turning and moving the world that way was nauseating (playtest 2026-11-01).
two_hand=0
; Pulling the hands apart or together while grabbing the world scales it (1). Off (0): the
; grab only moves and turns, and the world stays at its starting scale.
two_hand_scale=0
; Strength of throws from the hand at your controller, in tenths: 10 = the object leaves at
; your hand's real speed (at the world's scale), 15 = one and a half times that.
hand_throw_gain_x10=15
; A throw (your hand faster than this as the grip opens, cm/s) leaves the hand at once and flies
; from where it was; slower, letting go puts the thing down, as the game does.
throw_flight=1
throw_min_speed_cm_s=100
; With the creature on the leash, a quick trigger tap on the land sends it there: the laser's spot
; (holding the trigger still takes hold of the land), or with the hand, the ground below it when
; it's within reach of the ground, else where it points.
leash_land_tap=1
; Each drawn hand closes into a fist while its grip is held on nothing, and the other hand is drawn
; open otherwise (its own fingers, not a copy of the god hand's). The poses are recorded from the
; game's own hand (open: hovering; fist: holding the land) into bwvr\hand_poses.bin.
fist_on_grip=1
; A scoop from a store's pile ends when the hand (or the laser point) is this far outside the pile.
scoop_leave_cm=20
; A store's piles and fields are reached from this much further than other things (the hand scoops
; from above them; the scoop also ends this much further out).
pile_reach_cm=50
; Catching: something in the air counts as touched from a little further away (catch_reach_cm),
; but only while it moves faster than this (a dropped thing settling on the ground doesn't).
catch_speed_cm_s=150
; The laser's diamond, where the laser hand sits on it: this size (percent), and behind the hand.
tip_under_hand_percent=50
; Things with an interaction of their own get a thin ring round them when the hand (or the laser)
; is on them: a store's piles, the store, fields, and what the trigger taps (houses, scrolls,
; signposts). Not villagers, trees, rocks and the like. This bright (percent; 0: none).
highlight_percent=35
; How far the drawn hand's fingers point below the controller's axis, in degrees.
finger_pitch_deg=15
; With always_hand=0 the hand switches to your controller only within near_in_cm of the ground.
near_in_cm=70
near_out_cm=85

[ui]
; Show the game's 2D (menus, panels, text) on a virtual screen floating about 2 m in front of you.
; Point the controller at it: the laser is the mouse there, the trigger clicks.
screen=1
; Show what the hand can do ("Pick Up", "Plant", "Throw"...) as words by the hand. The game's
; mouse pictures and mouse camera hints are not shown in VR.
hand_hints=1
; The tutorial signposts' "Did you know...?" lines on the virtual screen, instead of the game's
; bubble (which has no depth in the headset).
help_panel=1
; A word appears after the game has asked for it steadily for this long (milliseconds).
hint_delay_ms=1000
; Add the control to the word: "Activate - trigger", "Pick Up - grip", "Plant - let go".
hint_controls=1
; Also the game's line about the thing under the hand: "Wood Required: 7" over a scaffold,
; "Building Completed: 42%", a town's population, a miracle's name.
info_hints=1
; The spirits' captions (and their dark band) drawn this much larger than the rest of the screen,
; for sharper words (100 = as before). A long line is enlarged less, to stay within
; caption_view_deg of your view.
caption_scale_percent=200
caption_view_deg=70
; The game's gesture icons (the flat game's corner display) float above the left hand while its
; palm is turned up; otherwise they aren't drawn (at the screen's edge they were a ghost in the
; right eye's periphery). gesture_panel_cm: how wide the row of them is.
gesture_panel=1
gesture_panel_cm=30
; Words never shown (comma separated). Throwing or dropping is decided by your arm as you let go.
hidden_hints=Throw,Drop
